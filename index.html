<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space War</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>🚀 SPACE WAR</h1>

    <div id="hud">
        <span>Score: <b id="score">0</b></span>
        <span>❤️ <b id="lives">3</b></span>
        <span>Level: <b id="level">1</b></span>
    </div>

    <canvas id="game" width="420" height="680"></canvas>

    <div id="controls">
        <button id="left" type="button">◀</button>
        <button id="fire" type="button">🔥 FIRE</button>
        <button id="right" type="button">▶</button>
    </div>

    <div id="message">
        Move with ← → (or A/D) and shoot with Space
    </div>

    <script src="js/game.js"></script>
</body>
</html>
